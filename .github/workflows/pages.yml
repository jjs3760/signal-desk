name: Publish Signal Desk
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      morning:
        description: 'Run the daily 08:00 KST collection for the 08:30 release'
        type: boolean
        default: false
  schedule:
    - cron: '0 23 * * *'

permissions:
  contents: read
concurrency:
  group: public-dashboard
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - id: check
        env:
          MORNING: ${{ github.event_name == 'schedule' || inputs.morning }}
        run: |
          publish=true
          if [[ "$MORNING" == "true" ]]; then
            day=$(TZ=Asia/Seoul date +%F)
            url="https://jjs3760.github.io/signal-desk/latest.json?check=$GITHUB_RUN_ID"
            if curl -fsS --max-time 20 "$url" | jq -e --arg day "$day" '
              (.asOf >= ($day + "T08:00:00") and (.asOf | startswith($day)))
              and (.publishedAt >= ($day + "T08:30:00"))' >/dev/null; then
              publish=false
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.txt
      - run: npm ci
      - name: Collect market data and news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python backend/pipeline.py ${{ (github.event_name == 'schedule' || inputs.morning) && '--morning' || '' }}
      - run: npm run build -- --base=/signal-desk/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
